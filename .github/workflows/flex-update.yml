name: Update Flex endpoint

on:
    push:
        branches:
            - main

defaults:
    run:
        shell: bash

jobs:
    call-flex-update:
        uses: symfony/recipes/.github/workflows/callable-flex-update.yml@main
        permissions:
            contents: write
        with:
            branch: main
        secrets:
            token: ${{ secrets.GITHUB_TOKEN }}
